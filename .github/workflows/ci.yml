name: CI RAG-MAROC2

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke retrieval (si index présent)
        run: |
          if [ -f vector_store/faiss.index ]; then
            python scripts/test_retrieval.py || true
          fi

      - name: Pytest (LLM_MOCK, plan IEEE)
        env:
          LLM_MOCK: "1"
          WEBAPP_SECRET_KEY: ci-test-secret
          TOKENIZERS_PARALLELISM: "false"
        run: pytest tests/ -q --tb=short
